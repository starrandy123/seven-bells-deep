  const bd = P.bufferData;
  P.bufferData = function (t, s, u, a, b) {
    const bound = this.getParameter(t === this.ARRAY_BUFFER ? this.ARRAY_BUFFER_BINDING : this.ELEMENT_ARRAY_BUFFER_BINDING);
    T.buf.set(bound, typeof s === 'number' ? s : s.byteLength);
    return a === undefined ? bd.call(this, t, s, u) : bd.call(this, t, s, u, a, b);
  };
  const boundTex = (gl, target) => gl.getParameter(target === gl.TEXTURE_3D ? gl.TEXTURE_BINDING_3D : target === gl.TEXTURE_2D_ARRAY ? gl.TEXTURE_BINDING_2D_ARRAY : target === gl.TEXTURE_2D ? gl.TEXTURE_BINDING_2D : gl.TEXTURE_BINDING_CUBE_MAP);
  const add = (gl, target, fmt, w, h, d, levels) => {
    const t = boundTex(gl, target), bpp = BYTES[fmt] || 4; let s = 0, a = w, b = h, c = d;
    for (let i = 0; i < levels; i++) { s += a * b * c * bpp; a = Math.max(1, a >> 1); b = Math.max(1, b >> 1); if (target === gl.TEXTURE_3D) c = Math.max(1, c >> 1); }

    T.tex.set(t, { s, w, h, d, fmt: fmt.toString(16), levels });
  };
  const dt = P.deleteTexture; P.deleteTexture = function (t) { T.tex.delete(t); return dt.call(this, t); };
  const db = P.deleteBuffer; P.deleteBuffer = function (b) { T.buf.delete(b); return db.call(this, b); };
  const dr = P.deleteRenderbuffer; P.deleteRenderbuffer = function (b) { T.rb.delete(b); return dr.call(this, b); };

const gl = renderer.getContext();

  const big = [...T.tex.values()].sort((a, b) => b.s - a.s).slice(0, 8).map(t => `${t.w}x${t.h}${t.d > 1 ? 'x' + t.d : ''} ${t.fmt} ${(t.s / 1048576).toFixed(1)}MB`);

// L4: shimmer. A slow dolly past the scene; the second difference of each pixel in time, in 1/255ths. Flicker scores high, smooth change near zero.
async function shimmer(n = 14) {
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, cw = 256, ch = 256, x0 = (w - cw) >> 1, y0 = (h - ch) >> 2;
  const frames = [], px = () => { const b = new Uint8Array(cw * ch * 4); gl.readPixels(x0, y0, cw, ch, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; };

  for (let i = 0; i < n; i++) { camera.position.addScaledVector(dir, .05); camera.updateMatrixWorld(); frame(0); frames.push(px()); }   // time stands still: only aliasing moves
  let sum = 0, top = 0, c = 0;

async function flips(n = 20) {
  const read = () => ({ programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries, heap: performance.memory ? performance.memory.usedJSHeapSize : 0 });
  for (const n of ['painted', 'painted_day', 'real']) { look.setLook(n, .01); for (let i = 0; i < 5; i++) frame(1 / 30); }
  const a = read();
  for (let i = 0; i < n; i++) { look.setLook(['painted', 'real', 'painted_day'][i % 3], .05); for (let k = 0; k < 4; k++) frame(1 / 30); }
  look.setLook('real', .01); for (let i = 0; i < 5; i++) frame(1 / 30);
  const b = read();
  return { before: a, after: b, lookNow: look.lookName, grew: b.programs - a.programs + b.textures - a.textures + b.geometries - a.geometries };
}
async function measure(n = 40) {
  const px = new Uint8Array(4), times = [];
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    frame(1 / 60);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    times.push(performance.now() - t0);
    await new Promise(r => requestAnimationFrame(r));
  }
  times.sort((a, b) => a - b);
  return { avgMs: +(times.reduce((s, t) => s + t, 0) / n).toFixed(1), p95Ms: +times[Math.floor(n * .95)].toFixed(1), worstMs: +times[n - 1].toFixed(1) };
}
// Super speed: the camera runs the map at 48 m/s, one real frame at a time, with the GPU waited on.
async function flight(seconds = 14, speed = 48) {
  const route = [[-26, -548, -6], [-34, -322, -14], [20, -200, -45], [20, 40, -44], [-200, 30, -42], [-430, 30, -46], [-300, 300, -60], [100, 500, -120], [440, 100, -60], [300, -300, -20]].map(p => W(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(route), len = curve.getLength();
  const px = new Uint8Array(4), times = [], dt = 1 / 60, slow = [];
  let u = 0;
  const n = Math.round(seconds * 60);
  for (let i = 0; i < n; i++) {
    u = (u + dt * speed / len) % 1;
    curve.getPointAt(u, camera.position);
    const t = curve.getTangentAt(u);
    camera.position.y = Math.max(camera.position.y, world.heightAt(camera.position.x, -camera.position.z) + 3);
    camera.lookAt(camera.position.x + t.x * 10, camera.position.y + t.y * 10, camera.position.z + t.z * 10);
    camera.updateMatrixWorld(); focus.copy(camera.position);
    const t0 = performance.now(), pr0 = renderer.info.programs.length, tx0 = renderer.info.memory.textures, ge0 = renderer.info.memory.geometries;
    frame(dt);
    const t1 = performance.now();
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const t2 = performance.now();
    times.push(t2 - t0);
    if (t2 - t0 > 16.7) slow.push({ i, ms: +(t2 - t0).toFixed(1), js: +(t1 - t0).toFixed(1), gpu: +(t2 - t1).toFixed(1), programs: renderer.info.programs.length - pr0, textures: renderer.info.memory.textures - tx0, geometries: renderer.info.memory.geometries - ge0, at: [camera.position.x | 0, camera.position.z | 0] });
    await new Promise(r => requestAnimationFrame(r));
  }
  const sorted = times.slice().sort((a, b) => a - b), long = times.filter(t => t > 16.7).length;
  return { frames: n, avgMs: +(times.reduce((s, t) => s + t, 0) / n).toFixed(2), p95Ms: +sorted[Math.floor(n * .95)].toFixed(2), p99Ms: +sorted[Math.floor(n * .99)].toFixed(2), worstMs: +sorted[n - 1].toFixed(2), worstFrame: times.indexOf(sorted[n - 1]), longPct: +(100 * long / n).toFixed(2), calls: look.stats().calls, slow: slow.slice(0, 6) };
}
function stats() {
  const i = renderer.info;
  const ls = look.stats();
  return { cam: camName, tier, buffer: [gl.drawingBufferWidth, gl.drawingBufferHeight], calls: ls.calls, triangles: ls.triangles, points: ls.points, tris: world.tris(), textures: i.memory.textures, geometries: i.memory.geometries, programs: i.programs.length, world: world.stats() };
}

if (q.has('powers')) {
  const P = new THREE.Group(); scene.add(P);
  const water = new THREE.Mesh(new THREE.TorusKnotGeometry(1.1, .42, 180, 24, 2, 3), look.waterMat()), ice = new THREE.Group(), iceM = look.iceMat();
  for (let i = 0; i < 9; i++) { const c = new THREE.Mesh(new THREE.ConeGeometry(.28 + i * .03, 1.6 + (i % 4) * .7, 5), iceM); c.position.set(Math.cos(i * 2.4) * .9, .4, Math.sin(i * 2.4) * .9); c.rotation.set(Math.sin(i) * .4, i, Math.cos(i * 1.7) * .4); ice.add(c); }
  ice.position.x = 2.4; water.position.x = -1.6; P.add(water, ice); window.__powers = { P, water, ice };
  P.position.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 8);
}
let auto = !q.has('still');
function loop(t) { if (auto) frame(1 / 60); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

Object.assign(window.__look, {
  three: THREE, scene, camera, look, world, sky, life, renderer, setCam, frame, stats, memory, measure, flight, flips, shimmer, cams: Object.keys(CAMS),
  step(n, dt = 1 / 30) { for (let i = 0; i < n; i++) frame(dt); },
  pause(v) { auto = !v; },
  shot() { return canvas.toDataURL('image/jpeg', .93); },
  ready: true,
});
if (window.__MOSA_BOOT) window.__MOSA_BOOT.ok = true;
