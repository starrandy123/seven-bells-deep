<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Seven Bells Deep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1v14M3 2v5c0 2 2 3 5 3s5-1 5-3V2%22 fill=%22none%22 stroke=%22%234ff0ff%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<style>
  :root { --ink: #eafcff; --dim: rgba(234, 252, 255, 0.78); --glow: #4ff0ff; --gold: #f0c878; --red: #ff6d5e; --deep: rgba(4, 22, 40, 0.8); --sheet: rgba(3, 18, 32, 0.94);
          --font: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif; --title: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
          --sa-t: env(safe-area-inset-top, 0px); --sa-r: env(safe-area-inset-right, 0px); --sa-b: env(safe-area-inset-bottom, 0px); --sa-l: env(safe-area-inset-left, 0px);
          --top: max(12px, var(--sa-t)); --left: max(14px, var(--sa-l)); --right: max(14px, var(--sa-r)); --bottom: max(16px, var(--sa-b)); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04202f; color: var(--ink); font-family: var(--font);
               -webkit-user-select: none; user-select: none; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
  button { font-family: var(--font); color: var(--ink); -webkit-tap-highlight-color: transparent; }

  /* ---- the HUD: the top band and the feed are stacks, so nothing in them can ever sit on anything else in them ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s; }
  #hud.on { opacity: 1; }
  #vitals { position: absolute; left: var(--left); top: var(--top); width: min(42vw, 220px); }
  .bar { height: 10px; border-radius: 6px; background: rgba(2, 14, 26, 0.72); border: 1px solid rgba(255, 255, 255, 0.28); overflow: hidden; margin-bottom: 6px; }
  .bar i { display: block; height: 100%; width: 100%; transform-origin: left; }
  #hp i { background: linear-gradient(90deg, #ff9d6b, #ff6d5e); } #tide i { background: linear-gradient(90deg, #2bb8e0, var(--glow)); }
  #pearls { display: inline-block; font-size: 17px; font-weight: 700; padding: 2px 9px; border-radius: 9px; background: var(--deep); }

  #lead { position: absolute; top: calc(var(--top) + 66px); left: var(--left); right: var(--right); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #obj { max-width: 100%; box-sizing: border-box; text-align: center; font-size: 17px; line-height: 1.22; font-weight: 600; padding: 4px 13px; border-radius: 15px; background: var(--deep); border: 1px solid rgba(255, 255, 255, 0.2);
         display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #compass { position: relative; width: min(62vw, 320px); height: 16px; flex: none; border-bottom: 1px solid rgba(255, 255, 255, 0.34); -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  #mark { position: absolute; top: 0; width: 0; height: 0; margin-left: -7px; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid var(--gold); filter: drop-shadow(0 0 3px rgba(230, 189, 106, 0.8)); }
  #mark2 { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--glow); box-sizing: border-box; display: none; }
  #dist { font-size: 17px; font-weight: 700; color: var(--gold); padding: 0 8px; border-radius: 8px; background: var(--deep); }

  #feed { position: absolute; top: calc(var(--top) + 170px); left: var(--left); right: var(--right); max-height: calc(100vh - var(--top) - var(--bottom) - 560px); overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  #feed > div { display: none; max-width: 100%; box-sizing: border-box; border-radius: 13px; background: var(--deep); text-align: center; }
  #feed > div.on { display: block; animation: rise 0.34s ease-out; }
  #feed > div.bye { opacity: 0; transition: opacity 0.34s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #toast { padding: 9px 20px 10px; }
  #toast b { display: block; font: 500 clamp(24px, 6vw, 40px) var(--title); letter-spacing: 0.05em; }
  #toast span { display: block; font-size: 17px; font-weight: 600; margin-top: 3px; color: var(--dim); }
  #place { padding: 5px 16px; font: 500 18px var(--title); letter-spacing: 0.12em; }
  #bossbar { width: min(76vw, 460px); padding: 6px 12px 3px; }
  #bossbar b { font: 500 16px var(--title); letter-spacing: 0.14em; } #bossbar .bar { height: 11px; margin: 3px 0 4px; } #bossbar .bar i { background: linear-gradient(90deg, #b03a7a, #ff3fb4); }
  #timer { padding: 3px 14px; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; color: var(--gold); } #timer small { font-size: 17px; color: var(--ink); margin-right: 8px; font-weight: 600; }
  #tip { font-size: 17px; font-weight: 600; padding: 7px 14px; }
  #bark { padding: 7px 14px; font-size: 17px; line-height: 1.32; text-align: left; border-left: 3px solid var(--gold); } #bark b { color: var(--gold); margin-right: 7px; font-size: 17px; }
  #card { padding: 9px 14px 11px; text-align: left; max-width: min(92vw, 420px); border: 1px solid rgba(230, 189, 106, 0.42); } #card b { display: block; font: 500 18px var(--title); color: var(--gold); margin-bottom: 3px; } #card span { display: block; font-size: 17px; line-height: 1.36; }
  #card.book b { color: var(--glow); }
  #done { padding: 8px 18px 10px; border: 1px solid rgba(230, 189, 106, 0.5); } #done small { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); } #done b { display: block; font: 500 21px var(--title); margin: 1px 0; } #done span { display: block; font-size: 17px; color: var(--dim); font-weight: 600; }
  #event { padding: 8px 18px 10px; border: 1px solid rgba(79, 240, 255, 0.5); } #event small { display: block; font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--glow); } #event b { display: block; font: 500 21px var(--title); } #event span { display: block; font-size: 17px; color: var(--dim); font-weight: 600; }

  #feed > #hint { align-items: center; gap: 8px; padding: 5px 6px 5px 13px; border: 1px solid rgba(79, 240, 255, 0.6); pointer-events: auto; }
  #feed > #hint.on { display: flex; } #hint .txt { font-size: 17px; font-weight: 700; white-space: nowrap; }
  #hint .caps kbd { margin-right: 3px; } #hintSkip { min-height: 62px; min-width: 62px; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.34); background: rgba(255, 255, 255, 0.1); font-size: 17px; font-weight: 700; cursor: pointer; }
  .pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 240, 255, 0.85); } 55% { box-shadow: 0 0 0 16px rgba(79, 240, 255, 0); } }
  #thumb { position: absolute; width: 58px; height: 58px; margin: -29px; border-radius: 50%; display: none; background: rgba(255, 255, 255, 0.34); border: 2px solid rgba(255, 255, 255, 0.9); }
  #thumb.drag { display: block; animation: drag 1.5s ease-in-out infinite; } @keyframes drag { 0%, 100% { transform: translateX(0); opacity: 0.2; } 30% { opacity: 1; } 80% { transform: translateX(-70px); opacity: 0.9; } }
  #thumb.push { display: block; animation: push 1.3s ease-in-out infinite; } @keyframes push { 0%, 100% { transform: translateY(0); opacity: 0.3; } 60% { transform: translateY(-40px); opacity: 1; } }
  #wp { position: absolute; left: 0; top: 0; display: none; width: 0; height: 0; } #wp i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; transform: rotate(45deg); background: var(--gold); border: 2px solid #3a2606; box-sizing: border-box; }
  #wp.on { display: block; }

  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 20, 24, 0.62)); }
  #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.7s; background: #021019; }
  #fade.on { opacity: 1; }
  #speedv { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 48%, rgba(190, 245, 255, 0.34) 86%, rgba(230, 252, 255, 0.6)); }

  /* ---- the controls, to the industry standard (Randy, 1 Nov: "best practice standard MMO type HUD ... industry standard"):
     Apple HIG, Game controls: frequent buttons by the thumb, clear of the move and camera regions; menus at the top; 44 pt at least;
     hide what does not apply. The mobile action-RPG convention (Diablo Immortal, Wild Rift, our Colosseum): a big attack in the bottom
     right corner, the other actions in an arc around it. The MMO convention: the skill hotbar in the bottom middle, between the thumbs
     (Black Desert Mobile; Colosseum's skill bar). A hotbar slot USES its power (hold Call: Shoalsong). ---- */
  .btn { position: absolute; pointer-events: auto; border-radius: 50%; display: none; align-items: center; justify-content: center; text-align: center; color: var(--ink); touch-action: none;
         font-weight: 800; font-size: 14px; letter-spacing: -0.2px; line-height: 1.05; padding: 0; overflow-wrap: anywhere; background: rgba(6, 34, 54, 0.6); border: 2px solid rgba(160, 240, 255, 0.5); width: 60px; height: 60px; box-sizing: border-box; }
  #hotbar .btn.locked { opacity: .42; filter: grayscale(1); }
  .build { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: rgba(255, 255, 255, .72); pointer-events: none; }
  .btn.show { display: flex; } .btn.down { background: rgba(26, 120, 150, 0.94) !important; border-color: #fff !important; transform: scale(0.93); box-shadow: 0 0 18px rgba(160, 240, 255, 0.9); }
  body:not(.touch) .btn::after { content: attr(data-key); position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; padding: 0 5px; border-radius: 6px; background: rgba(4, 22, 40, 0.92); color: var(--gold); white-space: nowrap; }
  .btn.cool { color: rgba(234, 252, 255, 0.6); background: rgba(6, 34, 54, 0.4); border-color: rgba(160, 240, 255, 0.24); }
  .btn.call { background: #ffd678; color: #2a1a00; border-color: #fff; transform: scale(1.18); transition: transform 0.08s; box-shadow: 0 0 26px rgba(255, 214, 120, 0.9); }
  /* the arc: Colosseum's geometry, Strike in the corner */
  #bAtk { width: 88px; height: 88px; right: calc(var(--right) + 6px); bottom: calc(var(--bottom) + var(--lift) + 20px); font-size: 18px; background: rgba(96, 62, 10, 0.8); border-color: #ffe0a0; }
  #bParry { width: 64px; height: 64px; right: calc(var(--right) + 104px); bottom: calc(var(--bottom) + var(--lift) + 8px); }
  #bBoost { right: calc(var(--right) + 95px); bottom: calc(var(--bottom) + var(--lift) + 96px); }
  #bJump { right: calc(var(--right) + 8px); bottom: calc(var(--bottom) + var(--lift) + 120px); background: rgba(24, 58, 96, 0.78); }
  #bRide { right: calc(var(--right) + 8px); bottom: calc(var(--bottom) + var(--lift) + 192px); background: rgba(14, 84, 68, 0.84); border-color: #bff5dc; }
  /* the hotbar: bottom middle, at the screen's foot, under the stick and the arc (Randy, 1 Nov: "put the hot bar below that diamond and
     joystick buttons"); --lift raises the stick and the arc over it */
  #hud { --lift: 58px; }
  #hotbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--bottom); display: flex; gap: 5px; pointer-events: none; }
  #hotbar .btn { position: relative; width: 46px; height: 46px; border-radius: 12px; font-size: 11px; font-weight: 700; letter-spacing: 0; background: rgba(4, 22, 40, 0.6); border-width: 1.5px; border-color: rgba(160, 240, 255, 0.36); }
  @media (max-width: 360px) { #hotbar { gap: 3px; } #hotbar .btn { width: 41px; height: 46px; } }      /* all seven stand on a 320-wide phone */
  #hotbar #bStance { border-color: #9ff4ff; }
  body[data-stance=ice] #hotbar #bStance { background: rgba(70, 96, 130, 0.72); border-color: #e4f6ff; }
  #bCast.call { border-color: #ffe0a0; }
  #stick { position: absolute; left: calc(var(--left) + 10px); bottom: calc(var(--bottom) + var(--lift)); width: 132px; height: 132px; border-radius: 50%; display: none; pointer-events: auto; touch-action: none;
           background: rgba(6, 40, 62, 0.34); border: 2px solid rgba(160, 240, 255, 0.42); }
  body.touch #stick { display: block; }
  #nub { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px; border-radius: 50%; background: rgba(160, 240, 255, 0.4); border: 2px solid rgba(255, 255, 255, 0.6); }
  #pauseB { position: absolute; right: var(--right); top: var(--top); width: 62px; height: 62px; pointer-events: auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer;
            background: var(--deep); border: 1px solid rgba(255, 255, 255, 0.3); color: var(--ink); font-size: 18px; font-weight: 800; }
  body.menu #hud, body.menu #talk, body.menu #bars, body.cine #hud { visibility: hidden; }
  #bars { position: fixed; inset: 0; display: none; pointer-events: none; }
  #bars.on { display: block; }
  #bars .b { position: absolute; left: 0; right: 0; height: 11vh; background: #000; animation: barIn 0.45s ease-out; } #bars .t { top: 0; } #bars .l { bottom: 0; }
  @keyframes barIn { from { height: 0; } }
  #cineText { position: absolute; left: 12px; right: 12px; bottom: max(8px, var(--sa-b)); text-align: center; font: 500 clamp(17px, 2.4vw, 20px) var(--title); letter-spacing: 0.04em; color: var(--ink); }
  #cineSkip, #cinePause { position: absolute; top: var(--top); min-width: 62px; min-height: 62px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(3, 18, 32, 0.88); font-size: 17px; font-weight: 700; pointer-events: auto; touch-action: none; cursor: pointer; }
  #cineSkip { right: var(--right); } #cinePause { right: calc(var(--right) + 74px); }
  body.talking #stick, body.talking .btn, body.talking #lead, body.talking #feed, body.talking #vitals, body.talking #pauseB, body.talking #hint { display: none !important; }

  /* a short phone upright: the Call moves over the stick, so the feed has room */
  @media (max-height: 740px) and (min-height: 461px) {
    #feed { max-height: calc(100vh - var(--top) - var(--bottom) - 508px); }
  }
  /* turned: the lead band sits between the vitals and the pause button, the feed between the stick and the cluster */
  @media (max-height: 460px) {
    #vitals { width: 170px; }
    #lead { top: var(--top); left: calc(var(--left) + 184px); right: calc(var(--right) + 76px); }
    #obj { max-width: min(46vw, 420px); }
    #compass { width: min(40vw, 320px); }
    #feed { top: calc(var(--top) + 100px); left: calc(var(--left) + 152px); right: calc(var(--right) + 250px); max-height: calc(100vh - var(--top) - var(--bottom) - 170px); }
    #toast b { font-size: 26px; }
    /* turned: the hotbar in the bottom middle, between the stick and the arc */
    #bRide { right: calc(var(--right) + 176px); bottom: calc(var(--bottom) + var(--lift) + 96px); }
  }

  /* ---- talking ---- */
  #talk { position: fixed; left: var(--left); right: var(--right); bottom: var(--bottom); display: none; gap: 12px; padding: 12px; border-radius: 16px; background: var(--sheet); border: 1px solid rgba(230, 189, 106, 0.5); box-sizing: border-box; max-width: 760px; margin: 0 auto; min-height: 138px; pointer-events: auto; touch-action: none; cursor: pointer; }
  #talk.on { display: flex; }
  #talkPic { width: 92px; height: 115px; flex: none; border-radius: 4px; background: #0b2a40 center/cover no-repeat; }
  #talkBody { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #talkWho { font: 600 18px var(--title); color: var(--gold); letter-spacing: 0.04em; min-height: 22px; }
  #talkText { font-size: 17px; line-height: 1.38; margin-top: 4px; flex: 1; }
  #talkNext { align-self: flex-end; font-size: 17px; font-weight: 700; color: var(--dim); }
  #talkSkip { position: absolute; right: 0; top: -70px; min-width: 76px; min-height: 62px; background: rgba(3, 18, 32, 0.9) !important; border-radius: 11px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); font-size: 17px; font-weight: 700; }
  @media (max-height: 460px) { #talkPic { width: 76px; height: 95px; } #talk { min-height: 118px; padding: 10px; } }

  /* ---- screens ---- */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; pointer-events: auto; touch-action: pan-y; }
  .screen.on { display: flex; }
  /* the title sits on the picture: no box, a hard outline so it reads over anything, the Warden left clear between the words and the buttons */
  #title { justify-content: space-between; padding: calc(var(--top) + 7vh) var(--right) calc(var(--bottom) + 3vh) var(--left); background: linear-gradient(180deg, transparent 72%, rgba(1, 26, 44, 0.3)); }
  #title h1 { font: 500 clamp(40px, 11.5vw, 84px) var(--title); line-height: 1.1; letter-spacing: 0.09em; color: #fff; text-align: center; max-width: min(92vw, 900px); text-wrap: balance; margin: 0 0 8px; text-shadow: 2px 0 0 #052a3e, -2px 0 0 #052a3e, 0 2px 0 #052a3e, 0 -2px 0 #052a3e, 2px 2px 0 #052a3e, -2px 2px 0 #052a3e, 2px -2px 0 #052a3e, -2px -2px 0 #052a3e, 0 8px 30px rgba(0, 30, 50, 0.5); }
  #title p { margin: 0; font-size: 17px; font-weight: 600; color: #fff; text-shadow: 1px 0 0 #052a3e, -1px 0 0 #052a3e, 0 1px 0 #052a3e, 0 -1px 0 #052a3e, 1px 1px 0 #052a3e, -1px 1px 0 #052a3e, 1px -1px 0 #052a3e, -1px -1px 0 #052a3e; }
  #titleTop, #titleBtns { display: flex; flex-direction: column; align-items: center; }
  #titleBtns { gap: 12px; } #titleBtns .link { margin: 0; }
  @media (max-height: 460px) {
    #title { padding: var(--top) var(--right) var(--bottom) var(--left); }
    #title h1 { font-size: 40px; max-width: none; margin: 0 0 2px; }
    #titleBtns { flex-direction: row; gap: 12px; align-self: flex-end; } .cta { padding: 10px 34px; }
  }
  .cta { font: 700 18px var(--font); color: #03212d; background: linear-gradient(180deg, #b7fbff, #4ff0ff); border: 0; padding: 16px 44px; border-radius: 999px; min-height: 62px; box-shadow: 0 8px 34px rgba(79, 240, 255, 0.34); cursor: pointer; }
  .link { font: 700 17px var(--font); color: var(--ink); background: rgba(4, 22, 40, 0.8); border: 1px solid rgba(255, 255, 255, 0.34); border-radius: 999px; padding: 10px 22px; margin-top: 14px; min-height: 62px; cursor: pointer; }
  #load { position: fixed; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(60vw, 280px); }
  #load .bar { height: 4px; } #load .bar i { background: var(--glow); transition: transform 0.2s; transform: scaleX(0); }
  #load small { display: block; text-align: center; font-size: 17px; color: var(--ink); margin-top: 4px; padding: 2px 6px; border-radius: 6px; background: rgba(4, 22, 40, 0.72); }
  #panel { background: var(--sheet); overflow: auto; justify-content: flex-start; padding: max(24px, var(--sa-t)) max(24px, var(--sa-r)) max(24px, var(--sa-b)) max(24px, var(--sa-l)); -webkit-overflow-scrolling: touch; }
  #panel .in { max-width: 640px; text-align: left; font-size: 17px; line-height: 1.5; padding-bottom: 24px; }
  #panel h2 { font: 500 30px var(--title); letter-spacing: 0.08em; margin: 18px 0 4px; } #panel h3 { font-size: 17px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--glow); margin: 20px 0 6px; }
  #panel table { width: 100%; border-collapse: collapse; } #panel td { vertical-align: top; padding: 5px 8px 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.14); }
  #panel td:first-child { color: var(--gold); font-weight: 700; white-space: nowrap; }
  kbd { font: 700 17px var(--font); padding: 2px 7px; border-radius: 5px; background: rgba(255, 255, 255, 0.2); color: var(--ink); }

  /* the menu: one thumb, a tab bar along the bottom, upright and turned */
  #menu { padding: 0; background: var(--sheet); align-items: stretch; justify-content: flex-start; text-align: left; touch-action: pan-y; }
  #menuHead { flex: none; display: flex; align-items: center; gap: 10px; padding: var(--top) var(--right) 6px var(--left); }
  #menuHead h2 { flex: 1; margin: 0; font: 500 24px var(--title); letter-spacing: 0.1em; }
  #menuHead span { font-size: 17px; font-weight: 700; color: var(--gold); }
  #menuBody { flex: 1; min-height: 0; position: relative; overflow: hidden; padding: 0 var(--right) 0 var(--left); }
  .tab { position: absolute; inset: 0 var(--right) 0 var(--left); display: none; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding-bottom: 12px; }
  .tab.on { display: block; }
  #tabs { flex: none; display: flex; gap: 4px; padding: 6px var(--right) var(--bottom) var(--left); background: rgba(2, 12, 22, 0.96); border-top: 1px solid rgba(255, 255, 255, 0.14); }
  #tabs button { flex: 1 1 auto; min-width: 62px; min-height: 62px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.08); font-size: 17px; font-weight: 700; padding: 0 2px; cursor: pointer; }
  #tabs button.on { background: #cfe9ee; color: #03212d; }
  #resume { background: linear-gradient(180deg, #b7fbff, #4ff0ff); color: #03212d; border: 0; min-width: 92px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 62px; padding: 8px 12px; margin-bottom: 7px; border-radius: 12px; background: rgba(255, 255, 255, 0.07); box-sizing: border-box; }
  .row.tapp { cursor: pointer; } .row.track { outline: 2px solid var(--gold); background: rgba(240, 200, 120, 0.12); }
